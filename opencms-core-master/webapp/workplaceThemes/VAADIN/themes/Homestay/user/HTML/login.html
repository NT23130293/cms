<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Đăng nhập - Homestay Cộng đồng Việt Nam</title>

  <!-- Tailwind CSS & Plugins -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            primary: {
              DEFAULT: '#15803D',
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              600: '#16a34a',
              700: '#15803D',
              800: '#166534',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: "Plus Jakarta Sans", sans-serif;
    }
  </style>
</head>
<body class="relative h-screen w-screen bg-slate-900 text-slate-800 antialiased flex flex-col justify-between overflow-hidden selection:bg-[#15803D] selection:text-white">

  <!-- Full Screen Background Video (1080p HD Native & Crystal Clear) -->
  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none bg-black">
    <video 
      autoplay 
      muted 
      loop 
      playsinline 
      class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full min-w-full min-h-full object-cover pointer-events-none">
      <source src="https://res.cloudinary.com/dwnbmfhel/video/upload/v1790141158/YTSave_YouTube_VIETNAM-My-Home-Masew-MyoMouse-Nguyen-Lo_Media_NSnkb1IAjbE_001_1080p_-_Trim_-_Trim_sdbnuc.mp4" type="video/mp4">
      <iframe 
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[177.78vh] min-w-full h-full min-h-[56.25vw] pointer-events-none scale-125 border-0" 
        src="https://www.youtube.com/embed/NSnkb1IAjbE?autoplay=1&mute=1&loop=1&playlist=NSnkb1IAjbE&controls=0&showinfo=0&rel=0&enablejsapi=1&iv_load_policy=3&modestbranding=1&playsinline=1&vq=hd1080"
        allow="autoplay; encrypted-media">
      </iframe>
    </video>
  </div>

  <!-- Header Navigation Bar -->
  <header class="relative z-20 w-full px-6 py-3 sm:px-10 flex items-center justify-between shrink-0">
    <a class="flex items-center gap-3 group text-decoration-none" href="homepage.html">
      <div class="h-12 sm:h-14 px-3 sm:px-4 rounded-2xl bg-white/15 backdrop-blur-md border border-white/30 flex items-center justify-center shadow-lg group-hover:bg-white/25 transition">
        <img src="../../owner/images/logo_white.png" alt="Homestay Logo" class="h-8 sm:h-10 w-auto object-contain">
      </div>
      <div class="hidden sm:flex flex-col">
        <span class="text-xs font-semibold text-emerald-200">Cộng đồng Homestay Việt Nam</span>
        <span class="text-[11px] text-white/70 font-normal">Về bản làng, tìm bình yên</span>
      </div>
    </a>
    <div class="flex items-center gap-3">
      <a class="flex items-center gap-1.5 text-xs font-semibold text-white px-4 py-2 rounded-xl bg-[#15803D]/85 hover:bg-[#15803D] backdrop-blur-md border border-emerald-400/40 shadow-sm transition" href="homepage.html">
        <i class="bi bi-house-door text-xs"></i>
        <span>Về trang chủ</span>
      </a>
    </div>
  </header>

  <!-- Right-aligned Login Box -->
  <main class="relative z-20 flex-1 flex items-center justify-center sm:justify-end px-4 sm:px-12 md:px-20 lg:px-28 py-2 sm:py-4 overflow-hidden">
    <div class="w-full max-w-[365px] bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/60 p-6 sm:p-7 relative overflow-hidden transition-all duration-300 my-auto">

      <!-- Header Title -->
      <div class="mb-4">
        <h2 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight leading-snug">Đăng nhập tài khoản</h2>
        <p class="text-xs text-slate-500 mt-1">Chào mừng bạn quay trở lại với Homestay Việt Nam</p>
      </div>

      <!-- Role Switcher Tabs (Khách thuê / Chủ Homestay) -->
      <div class="bg-slate-100/90 p-1 rounded-xl flex gap-1 mb-3.5 border border-slate-200/80">
        <button class="flex-1 py-2 px-2.5 rounded-lg text-xs font-semibold transition-all duration-200 flex items-center justify-center gap-1.5 bg-[#15803D] text-white shadow-sm" id="tab-tourist" onclick="switchRole('tourist')" type="button">
          <i class="bi bi-person-luggage text-sm"></i>
          <span>Khách thuê</span>
        </button>
        <button class="flex-1 py-2 px-2.5 rounded-lg text-xs font-semibold transition-all duration-200 flex items-center justify-center gap-1.5 text-slate-600 hover:text-slate-900 hover:bg-white/80" id="tab-owner" onclick="switchRole('owner')" type="button">
          <i class="bi bi-house-heart-fill text-sm"></i>
          <span>Chủ Homestay</span>
        </button>
      </div>

      <!-- Form Inputs -->
      <form id="login-form" class="space-y-3.5" onsubmit="handleLogin(event)">
        <!-- Email / Phone -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1" for="username-input">
            Email hoặc Số điện thoại <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="bi bi-envelope text-sm"></i>
            </div>
            <input class="w-full pl-10 pr-4 py-2.5 bg-slate-50/90 hover:bg-white focus:bg-white text-slate-900 text-sm rounded-xl border border-slate-300 focus:border-[#15803D] focus:ring-2 focus:ring-[#15803D]/20 outline-none transition font-medium placeholder-slate-400" id="username-input" placeholder="maichi.lehoang@gmail.com hoặc 0912..." type="text" value="maichi.lehoang@gmail.com" required>
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1" for="password-input">
            Mật khẩu <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="bi bi-lock text-sm"></i>
            </div>
            <input class="w-full pl-10 pr-10 py-2.5 bg-slate-50/90 hover:bg-white focus:bg-white text-slate-900 text-sm rounded-xl border border-slate-300 focus:border-[#15803D] focus:ring-2 focus:ring-[#15803D]/20 outline-none transition font-medium placeholder-slate-400" id="password-input" placeholder="Nhập mật khẩu" type="password" value="••••••••••••" required>
            <button class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none cursor-pointer" onclick="togglePasswordVisibility()" type="button">
              <i class="bi bi-eye-slash text-sm" id="eye-icon"></i>
            </button>
          </div>
          <!-- Quên mật khẩu link -->
          <div class="flex justify-end mt-1">
            <button type="button" onclick="openForgotPasswordModal()" class="text-xs font-semibold text-[#15803D] hover:text-[#166534] hover:underline flex items-center gap-1 cursor-pointer">
              <i class="bi bi-key text-xs"></i>
              <span>Quên mật khẩu?</span>
            </button>
          </div>
        </div>

        <!-- Primary CTA Button -->
        <button class="w-full mt-1.5 py-2.5 px-4 bg-[#15803D] hover:bg-[#166534] active:scale-[0.99] text-white font-bold text-sm rounded-xl shadow-lg shadow-[#15803D]/25 transition flex items-center justify-center gap-2 cursor-pointer" type="submit">
          <span>Đăng nhập</span>
          <i class="bi bi-arrow-right text-xs"></i>
        </button>
      </form>

      <!-- Divider -->
      <div class="relative my-3.5">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-slate-200"></div>
        </div>
        <div class="relative flex justify-center text-xs">
          <span class="px-3 bg-white text-slate-400 font-medium">Hoặc đăng nhập nhanh bằng</span>
        </div>
      </div>

      <!-- Social Logins -->
      <div class="grid grid-cols-2 gap-2.5">
        <button class="flex items-center justify-center gap-2 py-2 px-3 rounded-xl border border-slate-200 hover:border-slate-300 hover:bg-slate-50 transition text-slate-700 text-xs font-semibold cursor-pointer" type="button" onclick="alert('Đăng nhập Google thành công!'); window.location.href='homepage.html';">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z" fill="#EA4335"></path>
            <path d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z" fill="#4285F4"></path>
            <path d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.8s.2-2.1.4-2.8L1.9 6.3C.7 8.7 0 10.3 0 12s.7 3.3 1.9 5.7l3.7-2.9z" fill="#FBBC05"></path>
            <path d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z" fill="#34A853"></path>
          </svg>
          <span>Google</span>
        </button>
        <button class="flex items-center justify-center gap-2 py-2 px-3 rounded-xl border border-slate-200 hover:border-slate-300 hover:bg-slate-50 transition text-slate-700 text-xs font-semibold cursor-pointer" type="button" onclick="alert('Đăng nhập Facebook thành công!'); window.location.href='homepage.html';">
          <i class="bi bi-facebook text-blue-600 text-sm"></i>
          <span>Facebook</span>
        </button>
      </div>

      <!-- Bottom Registration Links (Nối sang register.html với role) -->
      <div class="pt-3.5 mt-3.5 border-t border-slate-200 bg-slate-50/90 -mx-6 sm:-mx-7 -mb-6 sm:-mb-7 p-3.5 sm:px-6 rounded-b-3xl border-slate-100">
        <div class="text-center mb-2">
          <span class="text-xs font-semibold text-slate-700">Bạn chưa có tài khoản?</span>
        </div>
        <div class="flex flex-col gap-2 mt-2">
          <a class="py-2.5 px-3 rounded-xl border border-emerald-300 bg-white hover:bg-emerald-50 text-[#15803D] text-xs font-bold text-center transition flex items-center justify-center gap-2 shadow-sm" href="register.html?role=guest" id="link-reg-guest">
            <i class="bi bi-person-luggage text-sm"></i>
            <span>Đăng ký Khách thuê</span>
          </a>
          <a class="py-2.5 px-3 rounded-xl border border-slate-200 bg-white hover:bg-slate-100 text-slate-700 hover:text-emerald-800 text-xs font-bold text-center transition flex items-center justify-center gap-2 shadow-sm" href="register.html?role=host" id="link-reg-host">
            <i class="bi bi-house-heart-fill text-sm text-emerald-600"></i>
            <span>Đăng ký Chủ nhà</span>
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal Quên mật khẩu -->
  <div id="forgot-password-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-md p-6 relative">
      <button type="button" onclick="closeForgotPasswordModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center text-sm font-bold transition">
        <i class="bi bi-x-lg"></i>
      </button>

      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-2xl bg-emerald-100 text-[#15803D] flex items-center justify-center font-bold text-lg">
          <i class="bi bi-key"></i>
        </div>
        <div>
          <h3 class="text-lg font-bold text-slate-900">Quên mật khẩu?</h3>
          <p class="text-xs text-slate-500">Nhập email hoặc số điện thoại để nhận mã khôi phục</p>
        </div>
      </div>

      <form onsubmit="handleResetPassword(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Email / Số điện thoại đăng ký</label>
          <input type="text" id="reset-input" class="w-full px-4 py-2.5 bg-slate-50 text-slate-900 text-sm rounded-xl border border-slate-300 focus:border-[#15803D] focus:ring-2 focus:ring-[#15803D]/20 outline-none" placeholder="Ví dụ: email@gmail.com hoặc 0912..." required>
        </div>

        <div class="flex gap-2 justify-end pt-2">
          <button type="button" onclick="closeForgotPasswordModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-xl transition">Hủy bỏ</button>
          <button type="submit" class="px-4 py-2 bg-[#15803D] hover:bg-[#166534] text-white font-bold text-xs rounded-xl transition shadow-md">Gửi mã khôi phục</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let activeRole = 'tourist';

    function switchRole(role) {
      activeRole = role;
      const tabOwner = document.getElementById('tab-owner');
      const tabTourist = document.getElementById('tab-tourist');
      const usernameInput = document.getElementById('username-input');
      const linkGuest = document.getElementById('link-reg-guest');
      const linkHost = document.getElementById('link-reg-host');

      if (role === 'owner') {
        tabOwner.className = "flex-1 py-2 px-3 rounded-lg text-xs font-semibold transition-all duration-200 flex items-center justify-center gap-2 bg-[#15803D] text-white shadow-sm";
        tabTourist.className = "flex-1 py-2 px-3 rounded-lg text-xs font-semibold transition-all duration-200 flex items-center justify-center gap-2 text-slate-600 hover:text-slate-900 hover:bg-white/80";
        if (usernameInput) {
          usernameInput.value = "chuhoang.homestay@gmail.com";
          usernameInput.placeholder = "chuhoang.homestay@gmail.com hoặc 0987...";
        }
        if (linkHost) {
          linkHost.className = "py-2.5 px-3 rounded-xl border border-emerald-400 bg-emerald-50 text-[#15803D] text-xs font-bold text-center transition flex items-center justify-center gap-2 shadow-sm";
        }
        if (linkGuest) {
          linkGuest.className = "py-2.5 px-3 rounded-xl border border-slate-200 bg-white hover:bg-slate-100 text-slate-700 text-xs font-bold text-center transition flex items-center justify-center gap-2 shadow-sm";
        }
      } else {
        tabTourist.className = "flex-1 py-2 px-3 rounded-lg text-xs font-semibold transition-all duration-200 flex items-center justify-center gap-2 bg-[#15803D] text-white shadow-sm";
        tabOwner.className = "flex-1 py-2 px-3 rounded-lg text-xs font-semibold transition-all duration-200 flex items-center justify-center gap-2 text-slate-600 hover:text-slate-900 hover:bg-white/80";
        if (usernameInput) {
          usernameInput.value = "maichi.lehoang@gmail.com";
          usernameInput.placeholder = "maichi.lehoang@gmail.com hoặc 0912...";
        }
        if (linkGuest) {
          linkGuest.className = "py-2.5 px-3 rounded-xl border border-emerald-300 bg-white hover:bg-emerald-50 text-[#15803D] text-xs font-bold text-center transition flex items-center justify-center gap-2 shadow-sm";
        }
        if (linkHost) {
          linkHost.className = "py-2.5 px-3 rounded-xl border border-slate-200 bg-white hover:bg-slate-100 text-slate-700 hover:text-emerald-800 text-xs font-bold text-center transition flex items-center justify-center gap-2 shadow-sm";
        }
      }
    }

    function togglePasswordVisibility() {
      const passInput = document.getElementById('password-input');
      const eyeIcon = document.getElementById('eye-icon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.className = 'bi bi-eye text-sm';
      } else {
        passInput.type = 'password';
        eyeIcon.className = 'bi bi-eye-slash text-sm';
      }
    }

    function openForgotPasswordModal() {
      const modal = document.getElementById('forgot-password-modal');
      if (modal) modal.classList.remove('hidden');
    }

    function closeForgotPasswordModal() {
      const modal = document.getElementById('forgot-password-modal');
      if (modal) modal.classList.add('hidden');
    }

    function handleResetPassword(e) {
      e.preventDefault();
      const resetInput = document.getElementById('reset-input');
      alert('Mã khôi phục mật khẩu đã được gửi tới: ' + (resetInput ? resetInput.value : ''));
      closeForgotPasswordModal();
    }

    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('username-input').value;
      // Lưu trạng thái đăng nhập
      try {
        sessionStorage.setItem('isLoggedIn', 'true');
        sessionStorage.setItem('userName', user);
        sessionStorage.setItem('userRole', activeRole === 'owner' ? 'host' : 'guest');
      } catch (err) {}

      // Chuyển hướng
      if (activeRole === 'owner') {
        window.location.href = 'personal-account.html';
      } else {
        window.location.href = 'homepage.html';
      }
    }

    // Tự động chọn tab theo query param ?role=host hoặc ?role=guest
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const role = params.get('role');
      if (role === 'host' || role === 'owner') {
        switchRole('owner');
      } else {
        switchRole('tourist');
      }
    });
  </script>
</body>
</html>
