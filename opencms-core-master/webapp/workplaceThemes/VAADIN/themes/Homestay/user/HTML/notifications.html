<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Tâm Thông Báo - YÊN Homestay</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../CSS/header.css">
    <link rel="stylesheet" href="../CSS/footer.css">
    <link rel="stylesheet" href="../CSS/notifications.css">
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="notifications-main-layout">

        <div class="noti-header-card">
            <div class="noti-header-title-group">
                <h1>
                    <span class="bell-icon-badge">
                        <i class="bi bi-bell-fill"></i>
                    </span>
                    Trung Tâm Thông Báo
                    <span class="unread-pill-badge" id="unreadHeaderBadge">3 thông báo mới</span>
                </h1>
                <p class="noti-header-subtitle">Theo dõi lịch check-in, cọc phòng, ưu đãi khuyến mãi & thông tin hoàn tiền</p>
            </div>

            <div class="noti-header-toolbar">
                <button class="btn-noti-tool btn-primary-mark" onclick="markAllNotificationsRead()">
                    <i class="bi bi-check2-all"></i> Đánh dấu đã đọc tất cả
                </button>
            </div>
        </div>

        <div class="noti-tabs-bar">
            <button class="noti-tab-btn active" data-category="all">
                <i class="bi bi-layers-fill"></i> Tất cả thông báo
                <span class="tab-count-tag" id="countAll">5</span>
            </button>
            <button class="noti-tab-btn" data-category="trip">
                <i class="bi bi-calendar-check-fill"></i> Đặt phòng & Lịch trình
                <span class="tab-count-tag" id="countTrip">2</span>
            </button>
            <button class="noti-tab-btn" data-category="promo">
                <i class="bi bi-gift-fill"></i> Khuyến mãi & Voucher
                <span class="tab-count-tag" id="countPromo">2</span>
            </button>
            <button class="noti-tab-btn" data-category="payment">
                <i class="bi bi-wallet2"></i> Thanh toán & Hoàn tiền
                <span class="tab-count-tag" id="countPayment">1</span>
            </button>
        </div>

        <div class="noti-card-container" id="notiListContainer">
        </div>

    </main>

    <div class="noti-modal-overlay" id="notiModalOverlay">
        <div class="noti-modal-card">
            <div class="noti-modal-header">
                <div class="noti-modal-header-left">
                    <div class="modal-type-icon trip" id="modalTypeIcon">
                        <i class="bi bi-calendar-event-fill"></i>
                    </div>
                    <div>
                        <h3 id="modalTitleText">Chi Tiết Thông Báo</h3>
                        <span class="noti-modal-time" id="modalTimeText">5 phút trước</span>
                    </div>
                </div>
                <button class="noti-modal-close-btn" onclick="closeNotificationModal()">&times;</button>
            </div>

            <div class="noti-modal-body">
                <div class="noti-modal-desc" id="modalDescText">
                    Nội dung thông báo chi tiết...
                </div>

                <div class="noti-modal-details-grid" id="modalDetailsGrid">
                </div>
            </div>

            <div class="noti-modal-footer">
                <button class="btn-noti-tool" onclick="closeNotificationModal()">Đóng</button>
                <a href="javascript:void(0)" class="btn-noti-link-main" id="modalActionBtn">
                    Trở về <i class="bi bi-arrow-right"></i>
                </a>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="../JS/homepage.js"></script>
    <script src="../JS/notifications.js"></script>
</body>
</html>
