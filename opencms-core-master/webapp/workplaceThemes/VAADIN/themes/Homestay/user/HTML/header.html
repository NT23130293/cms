<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YÊN Homestay - Header Navigation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../CSS/header.css">
</head>

<body>
<header class="header">
    <div class="header-container">
        <!-- Brand Logo -->
        <a href="#" class="brand-logo" title="YÊN - Trang chủ">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 10L12 3L21 10V20C21 20.5523 20.5523 21 20 21H4C3.44772 21 3 20.5523 3 20V10Z" />
                    <path d="M9 21V12H15V21" />
                </svg>
            </div>
            <div class="brand-text">
                <span class="brand-name">YÊN</span>
                <span class="brand-sub">Mái Ấm Bình Yên</span>
            </div>
        </a>
        <!-- Mobile Toggle Button -->
        <button class="mobile-toggle" id="mobileMenuBtn" aria-label="Toggle Menu">
            <i class="bi bi-list"></i>
        </button>
        <!-- Navigation Menu -->
        <nav class="header-nav">
            <ul class="nav-list" id="navList">
                <li class="nav-item">
                    <a href="javascript:void(0)" class="nav-link" data-name="Khuyến mãi">
                        <i class="bi bi-gift nav-icon"></i>
                        <span class="nav-text">Khuyến mãi</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="javascript:void(0)" class="nav-link" data-name="Hỗ trợ">
                        <i class="bi bi-headset nav-icon"></i>
                        <span class="nav-text">Hỗ trợ</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="javascript:void(0)" class="nav-link" data-name="Wishlist">
                        <i class="bi bi-heart nav-icon"></i>
                        <span class="nav-text">Wishlist</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="javascript:void(0)" class="nav-link" data-name="Thông báo">
                        <i class="bi bi-bell nav-icon"></i>
                        <span class="nav-text">Thông báo</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="javascript:void(0)" class="nav-link" data-name="Tin nhắn">
                        <i class="bi bi-chat-left-text nav-icon"></i>
                        <span class="nav-text">Tin nhắn</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="javascript:void(0)" class="nav-link" data-name="Đặt chỗ">
                        <i class="bi bi-calendar-check nav-icon"></i>
                        <span class="nav-text">Đặt chỗ</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="javascript:void(0)" class="nav-link active" data-name="Tài khoản">
                        <i class="bi bi-person-circle nav-icon"></i>
                        <span class="nav-text">Tài khoản</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</header>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const navLinks = document.querySelectorAll('.nav-link');
        const mobileBtn = document.getElementById('mobileMenuBtn');
        const navList = document.getElementById('navList');
        navLinks.forEach(link => {
            link.addEventListener('click', function() {
                navLinks.forEach(item => item.classList.remove('active'));
                this.classList.add('active');
            });
        });
        if (mobileBtn && navList) {
            mobileBtn.addEventListener('click', () => {
                navList.classList.toggle('show');
            });
        }
    });
</script>
</body>
</html>
